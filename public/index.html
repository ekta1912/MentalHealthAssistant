<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samaira - AI Mental Health & Wellness Companion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <header class="header-section">
            <h1 class="brand-title">
                <span class="brand-icon">🌿</span>
                <span>Samaira</span>
            </h1>
            <p class="brand-subtitle">Empathetic Voice & Mindful AI Companion</p>
        </header>

        <section id="chat-display">
            <div class="chat-welcome">Take a deep, gentle breath. I'm here to listen whenever you're ready.</div>
        </section>

        <section class="controls-section">
            <button id="start-btn" type="button">
                <span>🎙️</span>
                <span id="btn-text">Speak to Samaira</span>
            </button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
